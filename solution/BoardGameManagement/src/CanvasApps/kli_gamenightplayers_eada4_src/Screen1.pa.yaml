Screens:
  Screen1:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(107, 63, 160, 1)
      OnVisible: |-
        =Set(varRenameId, Blank());
        Set(varDeleteId, Blank());
        Set(varLastAction, "");
        Set(varReceiptVisible, false)
    Children:
      - conPlayersRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =RGBA(255, 255, 255, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - conPlayersHeader:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(107, 63, 160, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - txtPlayersTitle:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.Start
                        AlignInContainer: =AlignInContainer.Stretch
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =34
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =22
                        Text: ="Game Night Players"
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: ='TextCanvas.Weight'.Bold
                        Wrap: =false
            - conPlayersBody:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(255, 255, 255, 1)
                  FillPortions: =0
                  Height: =16 + 32 + 12 + 44 + 12 + If(varReceiptVisible, 118 + 12, 0) + 600 + 16
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =12
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - txtPlayersCount:
                      Control: Text@0.0.51
                      Properties:
                        Align: ='TextCanvas.Align'.Start
                        AlignInContainer: =AlignInContainer.Stretch
                        FontColor: =RGBA(36, 36, 36, 1)
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =18
                        Text: ="We have " & CountRows(galPlayersList.AllItems) & " players."
                        VerticalAlign: =VerticalAlign.Middle
                        Weight: ='TextCanvas.Weight'.Semibold
                        Wrap: =false
                  - btnPlayersRegisterMe:
                      Control: Button@0.0.45
                      Properties:
                        AccessibleLabel: ="Register me as a player"
                        AlignInContainer: =AlignInContainer.Stretch
                        Appearance: ='ButtonCanvas.Appearance'.Primary
                        BasePaletteColor: =RGBA(107, 63, 160, 1)
                        BorderRadius: =6
                        DisplayMode: =If(IsBlank(User().Email) || !IsBlank(LookUp(Players, 'Created By'.'Primary Email' = User().Email)), DisplayMode.Disabled, DisplayMode.Edit)
                        FontColor: =RGBA(255, 255, 255, 1)
                        FontSize: =14
                        Height: =44
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =With(
                            {created: Patch(Players, Defaults(Players), {Name: User().FullName, Email: User().Email})},
                            If(
                              IsBlank(created),
                              Notify("Could not register you.", NotificationType.Error),
                              Set(varLastPlayer, created);
                              Set(varLastAction, "Registered");
                              Set(varReceiptVisible, true)
                            )
                          )
                        Text: =If(IsBlank(LookUp(Players, 'Created By'.'Primary Email' = User().Email)), "Register me", "You're registered")
                  - conPlayersAddRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =70
                        LayoutAlignItems: =LayoutAlignItems.End
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =8
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        Visible: =false
                      Children:
                        - conPlayersAddField:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =4
                              LayoutMinHeight: =0
                              LayoutMinWidth: =120
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - txtPlayersAddLabel:
                                  Control: Text@0.0.51
                                  Properties:
                                    Align: ='TextCanvas.Align'.Start
                                    AlignInContainer: =AlignInContainer.Stretch
                                    FontColor: =RGBA(36, 36, 36, 1)
                                    Height: =22
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Text: ="New player name"
                                    VerticalAlign: =VerticalAlign.Middle
                                    Weight: ='TextCanvas.Weight'.Semibold
                                    Wrap: =false
                              - txtPlayersNewName:
                                  Control: TextInput@0.0.54
                                  Properties:
                                    AccessibleLabel: ="New player name"
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Appearance: ='TextInputCanvas.Appearance'.Outline
                                    BasePaletteColor: =RGBA(107, 63, 160, 1)
                                    FontColor: =RGBA(36, 36, 36, 1)
                                    FontSize: =14
                                    Height: =44
                                    LayoutMinWidth: =0
                                    Mode: ='TextInputCanvas.Mode'.SingleLine
                                    Placeholder: ="e.g. Alice"
                                    TriggerOutput: ='TextInputCanvas.TriggerOutput'.Keypress
                        - btnPlayersAdd:
                            Control: Button@0.0.45
                            Properties:
                              AccessibleLabel: ="Add player"
                              AlignInContainer: =AlignInContainer.End
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(107, 63, 160, 1)
                              BorderRadius: =6
                              DisplayMode: =If(IsBlank(Trim(txtPlayersNewName.Value)), DisplayMode.Disabled, DisplayMode.Edit)
                              FontColor: =RGBA(255, 255, 255, 1)
                              FontSize: =14
                              Height: =44
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =With(
                                  {newName: Trim(txtPlayersNewName.Value)},
                                  If(
                                    !IsBlank(newName),
                                    With(
                                      {created: Patch(Players, Defaults(Players), {Name: newName})},
                                      If(
                                        IsBlank(created),
                                        Notify("Could not add the player.", NotificationType.Error),
                                        Set(varLastPlayer, created);
                                        Set(varLastAction, "Added");
                                        Set(varReceiptVisible, true);
                                        Reset(txtPlayersNewName)
                                      )
                                    )
                                  )
                                )
                              Text: ="Add"
                              Width: =88
                  - conPlayersReceipt:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =RGBA(243, 238, 250, 1)
                        FillPortions: =0
                        Height: =118
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =12
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        Visible: =varReceiptVisible
                      Children:
                        - conPlayersReceiptTop:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - txtPlayersReceiptAction:
                                  Control: Text@0.0.51
                                  Properties:
                                    Align: ='TextCanvas.Align'.Start
                                    AlignInContainer: =AlignInContainer.Center
                                    FillPortions: =1
                                    FontColor: =RGBA(36, 36, 36, 1)
                                    Height: =22
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Text: |-
                                      ="Last change: " & varLastAction
                                    VerticalAlign: =VerticalAlign.Middle
                                    Weight: ='TextCanvas.Weight'.Semibold
                                    Wrap: =false
                              - btnPlayersDismissReceipt:
                                  Control: Button@0.0.45
                                  Properties:
                                    AccessibleLabel: ="Dismiss last change"
                                    AlignInContainer: =AlignInContainer.Center
                                    Appearance: ='ButtonCanvas.Appearance'.Subtle
                                    BorderRadius: =6
                                    FontColor: =RGBA(107, 63, 160, 1)
                                    FontSize: =14
                                    Height: =44
                                    LayoutMinWidth: =0
                                    OnSelect: =Set(varReceiptVisible, false)
                                    Text: ="Dismiss"
                                    Width: =88
                        - txtPlayersReceiptName:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Start
                              AlignInContainer: =AlignInContainer.Stretch
                              FontColor: =RGBA(36, 36, 36, 1)
                              Height: =22
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Text: |-
                                ="Name: " & varLastPlayer.Name
                              VerticalAlign: =VerticalAlign.Middle
                              Weight: ='TextCanvas.Weight'.Regular
                              Wrap: =false
                        - txtPlayersReceiptId:
                            Control: Text@0.0.51
                            Properties:
                              Align: ='TextCanvas.Align'.Start
                              AlignInContainer: =AlignInContainer.Stretch
                              FontColor: =RGBA(97, 97, 97, 1)
                              Height: =20
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =12
                              Text: |-
                                ="Player ID: " & Text(varLastPlayer.Player)
                              VerticalAlign: =VerticalAlign.Middle
                              Weight: ='TextCanvas.Weight'.Regular
                              Wrap: =false
                  - galPlayersList:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        AccessibleLabel: ="Players list"
                        Fill: =RGBA(255, 255, 255, 1)
                        FillPortions: =0
                        Height: =600
                        Items: =SortByColumns(Players, "kli_name", SortOrder.Ascending)
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        LoadingSpinnerColor: =RGBA(107, 63, 160, 1)
                        Selectable: =false
                        TabIndex: =0
                        TemplatePadding: =0
                        TemplateSize: =65
                      Children:
                        - conPlayersRowShell:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =Parent.TemplateHeight
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =10
                              PaddingLeft: =4
                              PaddingRight: =4
                              PaddingTop: =10
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              Width: =Parent.TemplateWidth
                            Children:
                              - conPlayersDisplayRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =!(!IsBlank(varRenameId) && varRenameId = ThisItem.Player) && !(!IsBlank(varDeleteId) && varDeleteId = ThisItem.Player)
                                  Children:
                                    - conPlayersRowInfo:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Center
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtPlayersRowName:
                                              Control: Text@0.0.51
                                              Properties:
                                                Align: ='TextCanvas.Align'.Start
                                                AlignInContainer: =AlignInContainer.Stretch
                                                FontColor: =RGBA(36, 36, 36, 1)
                                                Height: =24
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =16
                                                Text: =ThisItem.Name
                                                VerticalAlign: =VerticalAlign.Middle
                                                Weight: ='TextCanvas.Weight'.Semibold
                                                Wrap: =false
                                          - txtPlayersRowEmail:
                                              Control: Text@0.0.51
                                              Properties:
                                                Align: ='TextCanvas.Align'.Start
                                                AlignInContainer: =AlignInContainer.Stretch
                                                FontColor: =RGBA(97, 97, 97, 1)
                                                Height: =20
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =ThisItem.Email
                                                VerticalAlign: =VerticalAlign.Middle
                                                Visible: =!IsBlank(ThisItem.Email)
                                                Weight: ='TextCanvas.Weight'.Regular
                                                Wrap: =false
                                    - btnPlayersRename:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="Rename " & ThisItem.Name
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Subtle
                                          BorderRadius: =6
                                          FontColor: =RGBA(36, 36, 36, 1)
                                          FontSize: =18
                                          Height: =44
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Set(varDeleteId, Blank());
                                            Set(varRenameId, ThisItem.Player);
                                            Reset(txtPlayersRenameInput)
                                          Text: ="✎"
                                          Visible: =ThisItem.'Created By'.'Primary Email' = User().Email
                                          Width: =44
                                    - btnPlayersDelete:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="Delete " & ThisItem.Name
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Subtle
                                          BorderRadius: =6
                                          FontColor: =RGBA(196, 43, 28, 1)
                                          FontSize: =18
                                          Height: =44
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Set(varRenameId, Blank());
                                            Set(varDeleteId, ThisItem.Player)
                                          Text: ="✕"
                                          Visible: =false
                                          Width: =44
                              - conPlayersEditRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =!IsBlank(varRenameId) && varRenameId = ThisItem.Player
                                  Children:
                                    - conPlayersRenameField:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =8
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =160
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                        Children:
                                          - txtPlayersRenameLabel:
                                              Control: Text@0.0.51
                                              Properties:
                                                Align: ='TextCanvas.Align'.Start
                                                AlignInContainer: =AlignInContainer.Center
                                                FontColor: =RGBA(36, 36, 36, 1)
                                                Height: =24
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Text: ="Name"
                                                VerticalAlign: =VerticalAlign.Middle
                                                Weight: ='TextCanvas.Weight'.Semibold
                                                Width: =52
                                                Wrap: =false
                                          - txtPlayersRenameInput:
                                              Control: TextInput@0.0.54
                                              Properties:
                                                AccessibleLabel: ="New name for " & ThisItem.Name
                                                AlignInContainer: =AlignInContainer.Center
                                                Appearance: ='TextInputCanvas.Appearance'.Outline
                                                BasePaletteColor: =RGBA(107, 63, 160, 1)
                                                FillPortions: =1
                                                FontColor: =RGBA(36, 36, 36, 1)
                                                FontSize: =14
                                                Height: =40
                                                LayoutMinWidth: =100
                                                Mode: ='TextInputCanvas.Mode'.SingleLine
                                                TriggerOutput: ='TextInputCanvas.TriggerOutput'.Keypress
                                                Value: =ThisItem.Name
                                    - btnPlayersSaveRename:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="Save new name"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(107, 63, 160, 1)
                                          BorderRadius: =6
                                          DisplayMode: =If(IsBlank(Trim(txtPlayersRenameInput.Value)), DisplayMode.Disabled, DisplayMode.Edit)
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          FontSize: =18
                                          Height: =44
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =With(
                                              {newName: Trim(txtPlayersRenameInput.Value)},
                                              If(
                                                !IsBlank(newName),
                                                With(
                                                  {updated: Patch(Players, ThisItem, {Name: newName})},
                                                  If(
                                                    IsBlank(updated),
                                                    Notify("Could not rename the player.", NotificationType.Error),
                                                    Set(varLastPlayer, updated);
                                                    Set(varLastAction, "Renamed");
                                                    Set(varReceiptVisible, true);
                                                    Set(varRenameId, Blank())
                                                  )
                                                )
                                              )
                                            )
                                          Text: ="✓"
                                          Width: =44
                                    - btnPlayersCancelRename:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="Cancel rename"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Subtle
                                          BorderRadius: =6
                                          FontColor: =RGBA(36, 36, 36, 1)
                                          FontSize: =18
                                          Height: =44
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =Set(varRenameId, Blank());
                                            Reset(txtPlayersRenameInput)
                                          Text: ="✕"
                                          Width: =44
                              - conPlayersDeleteRow:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =44
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    Visible: =!IsBlank(varDeleteId) && varDeleteId = ThisItem.Player
                                  Children:
                                    - txtPlayersDeletePrompt:
                                        Control: Text@0.0.51
                                        Properties:
                                          Align: ='TextCanvas.Align'.Start
                                          AlignInContainer: =AlignInContainer.Center
                                          FillPortions: =1
                                          FontColor: =RGBA(196, 43, 28, 1)
                                          Height: =24
                                          LayoutMinWidth: =80
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Text: ="Delete " & ThisItem.Name & "?"
                                          VerticalAlign: =VerticalAlign.Middle
                                          Weight: ='TextCanvas.Weight'.Semibold
                                          Wrap: =false
                                    - btnPlayersConfirmDelete:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="Yes, delete " & ThisItem.Name
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(196, 43, 28, 1)
                                          BorderRadius: =6
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          FontSize: =14
                                          Height: =44
                                          LayoutMinWidth: =0
                                          OnSelect: |-
                                            =With(
                                              {gone: ThisItem},
                                              Remove(Players, gone);
                                              If(
                                                IsEmpty(Errors(Players)),
                                                Set(varLastPlayer, gone);
                                                Set(varLastAction, "Deleted");
                                                Set(varReceiptVisible, true);
                                                Set(varDeleteId, Blank()),
                                                Notify("Could not delete the player.", NotificationType.Error)
                                              )
                                            )
                                          Text: ="Yes"
                                          Width: =64
                                    - btnPlayersCancelDelete:
                                        Control: Button@0.0.45
                                        Properties:
                                          AccessibleLabel: ="Cancel delete"
                                          AlignInContainer: =AlignInContainer.Center
                                          Appearance: ='ButtonCanvas.Appearance'.Outline
                                          BorderRadius: =6
                                          FontColor: =RGBA(36, 36, 36, 1)
                                          FontSize: =14
                                          Height: =44
                                          LayoutMinWidth: =0
                                          OnSelect: =Set(varDeleteId, Blank())
                                          Text: ="Cancel"
                                          Width: =80
                              - conPlayersRowDivider:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =RGBA(224, 224, 224, 1)
                                    FillPortions: =0
                                    Height: =1
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
