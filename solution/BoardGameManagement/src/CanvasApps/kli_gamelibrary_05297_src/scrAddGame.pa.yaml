Screens:
  scrAddGame:
    Children:
      - lblAddGameHeading:
          Control: Label@2.5.1
          Properties:
            Height: =48
            Size: =24
            Text: ="Add a game"
            Width: =400
            X: =40
            Y: =40
      - btnBack:
          Control: Button@0.0.45
          Properties:
            Appearance: ='ButtonCanvas.Appearance'.Secondary
            OnSelect: =Back()
            Text: ="Back"
            X: =40
            Y: =110
