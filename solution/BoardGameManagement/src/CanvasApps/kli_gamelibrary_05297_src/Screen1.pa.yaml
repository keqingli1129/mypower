Screens:
  Screen1:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - galGames:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            Height: =Parent.Height - 80
            Items: ='Game Library'
            OnSelect: =EditForm(frmGame); Navigate(scrAddGame, ScreenTransition.Cover)
            TemplateSize: =80
            Width: =600
            X: =40
            Y: =40
          Children:
            - lblTitle:
                Control: Label@2.5.1
                Properties:
                  Size: =18
                  Text: =ThisItem.Title
                  Width: =Parent.TemplateWidth - 248
                  X: =16
                  Y: =10
            - lblPlayers:
                Control: Label@2.5.1
                Properties:
                  Align: =Align.Right
                  Text: =ThisItem.'Min players' & "–" & ThisItem.'Max players' & " players"
                  Width: =200
                  X: =Parent.TemplateWidth - 216
                  Y: =10
            - lblOwner:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(96, 96, 96, 1)
                  Height: =28
                  Size: =12
                  Text: |-
                    ="Owner: " & Coalesce(ThisItem.Owner.DisplayName, "nobody yet")
                  Width: =Parent.TemplateWidth - 248
                  X: =16
                  Y: =44
      - btnAddGame:
          Control: Button@0.0.45
          Properties:
            OnSelect: =NewForm(frmGame); Navigate(scrAddGame, ScreenTransition.Cover)
            Text: ="+ Add game"
            Width: =160
            X: =680
            Y: =40
