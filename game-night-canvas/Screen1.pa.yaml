Screens:
  Screen1:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
      LoadingSpinnerColor: =RGBA(107, 63, 160, 1)
      OnVisible: |-
        =Set(varRenameId, Blank());
        Set(varDeleteId, Blank());
        Set(varLastAction, "");
        Set(varReceiptVisible, false)
    Children:
      - conPlayersRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Width: =Parent.Width
            Height: =Parent.Height
            LayoutMinWidth: =0
            LayoutMinHeight: =0
            LayoutDirection: =LayoutDirection.Vertical
            LayoutOverflowY: =LayoutOverflow.Scroll
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            Fill: =RGBA(255, 255, 255, 1)
            DropShadow: =DropShadow.None
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
          Children:
            - conPlayersHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =64
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutJustifyContent: =LayoutJustifyContent.Center
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingLeft: =16
                  PaddingRight: =16
                  Fill: =RGBA(107, 63, 160, 1)
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                Children:
                  - txtPlayersTitle:
                      Control: Text
                      Properties:
                        Text: ="Game Night Players"
                        Size: =22
                        Weight: ='TextCanvas.Weight'.Bold
                        FontColor: =RGBA(255, 255, 255, 1)
                        Height: =34
                        Wrap: =false
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Align: ='TextCanvas.Align'.Start
            - conPlayersBody:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  FillPortions: =0
                  AlignInContainer: =AlignInContainer.Stretch
                  Height: =16 + 32 + 12 + 70 + 12 + If(varReceiptVisible, 118 + 12, 0) + 600 + 16
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =12
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  Fill: =RGBA(255, 255, 255, 1)
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                Children:
                  - txtPlayersCount:
                      Control: Text
                      Properties:
                        Text: ="We have " & CountRows(galPlayersList.AllItems) & " players."
                        Size: =18
                        Weight: ='TextCanvas.Weight'.Semibold
                        FontColor: =RGBA(36, 36, 36, 1)
                        Height: =32
                        Wrap: =false
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        VerticalAlign: =VerticalAlign.Middle
                        Align: ='TextCanvas.Align'.Start
                  - conPlayersAddRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =70
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.End
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                      Children:
                        - conPlayersAddField:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =1
                              AlignInContainer: =AlignInContainer.Stretch
                              LayoutMinWidth: =120
                              LayoutMinHeight: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =4
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                            Children:
                              - txtPlayersAddLabel:
                                  Control: Text
                                  Properties:
                                    Text: ="New player name"
                                    Size: =14
                                    Weight: ='TextCanvas.Weight'.Semibold
                                    FontColor: =RGBA(36, 36, 36, 1)
                                    Height: =22
                                    Wrap: =false
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    VerticalAlign: =VerticalAlign.Middle
                                    Align: ='TextCanvas.Align'.Start
                              - txtPlayersNewName:
                                  Control: TextInput
                                  Properties:
                                    Value: =""
                                    Placeholder: ="e.g. Alice"
                                    TriggerOutput: ='TextInputCanvas.TriggerOutput'.Keypress
                                    Mode: ='TextInputCanvas.Mode'.SingleLine
                                    Appearance: ='TextInputCanvas.Appearance'.Outline
                                    BasePaletteColor: =RGBA(107, 63, 160, 1)
                                    FontColor: =RGBA(36, 36, 36, 1)
                                    FontSize: =14
                                    AccessibleLabel: ="New player name"
                                    Height: =44
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                        - btnPlayersAdd:
                            Control: Button
                            Properties:
                              Text: ="Add"
                              AccessibleLabel: ="Add player"
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(107, 63, 160, 1)
                              FontColor: =RGBA(255, 255, 255, 1)
                              FontSize: =14
                              BorderRadius: =6
                              Width: =88
                              Height: =44
                              LayoutMinWidth: =0
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.End
                              DisplayMode: =If(IsBlank(Trim(txtPlayersNewName.Value)), DisplayMode.Disabled, DisplayMode.Edit)
                              OnSelect: |-
                                =With(
                                  {newName: Trim(txtPlayersNewName.Value)},
                                  If(
                                    !IsBlank(newName),
                                    With(
                                      {created: Patch(Players, Defaults(Players), {Name: newName})},
                                      If(
                                        IsBlank(created),
                                        Notify("Could not add the player.", NotificationType.Error),
                                        Set(varLastPlayer, created);
                                        Set(varLastAction, "Added");
                                        Set(varReceiptVisible, true);
                                        Reset(txtPlayersNewName)
                                      )
                                    )
                                  )
                                )
                  - conPlayersReceipt:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        Visible: =varReceiptVisible
                        FillPortions: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        Height: =118
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =4
                        PaddingTop: =12
                        PaddingBottom: =12
                        PaddingLeft: =12
                        PaddingRight: =12
                        Fill: =RGBA(243, 238, 250, 1)
                        DropShadow: =DropShadow.None
                        RadiusTopLeft: =8
                        RadiusTopRight: =8
                        RadiusBottomLeft: =8
                        RadiusBottomRight: =8
                      Children:
                        - conPlayersReceiptTop:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              Height: =44
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                            Children:
                              - txtPlayersReceiptAction:
                                  Control: Text
                                  Properties:
                                    Text: '="Last change: " & varLastAction'
                                    Size: =14
                                    Weight: ='TextCanvas.Weight'.Semibold
                                    FontColor: =RGBA(36, 36, 36, 1)
                                    Height: =22
                                    Wrap: =false
                                    FillPortions: =1
                                    LayoutMinWidth: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    VerticalAlign: =VerticalAlign.Middle
                                    Align: ='TextCanvas.Align'.Start
                              - btnPlayersDismissReceipt:
                                  Control: Button
                                  Properties:
                                    Text: ="Dismiss"
                                    AccessibleLabel: ="Dismiss last change"
                                    Appearance: ='ButtonCanvas.Appearance'.Subtle
                                    FontColor: =RGBA(107, 63, 160, 1)
                                    FontSize: =14
                                    BorderRadius: =6
                                    Width: =88
                                    Height: =44
                                    LayoutMinWidth: =0
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    OnSelect: =Set(varReceiptVisible, false)
                        - txtPlayersReceiptName:
                            Control: Text
                            Properties:
                              Text: '="Name: " & varLastPlayer.Name'
                              Size: =14
                              Weight: ='TextCanvas.Weight'.Regular
                              FontColor: =RGBA(36, 36, 36, 1)
                              Height: =22
                              Wrap: =false
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              VerticalAlign: =VerticalAlign.Middle
                              Align: ='TextCanvas.Align'.Start
                        - txtPlayersReceiptId:
                            Control: Text
                            Properties:
                              Text: '="Player ID: " & Text(varLastPlayer.Player)'
                              Size: =12
                              Weight: ='TextCanvas.Weight'.Regular
                              FontColor: =RGBA(97, 97, 97, 1)
                              Height: =20
                              Wrap: =false
                              FillPortions: =0
                              AlignInContainer: =AlignInContainer.Stretch
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              VerticalAlign: =VerticalAlign.Middle
                              Align: ='TextCanvas.Align'.Start
                  - galPlayersList:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: =SortByColumns(Players, "kli_name", SortOrder.Ascending)
                        Selectable: =false
                        ShowScrollbar: =true
                        Fill: =RGBA(255, 255, 255, 1)
                        BorderThickness: =0
                        LoadingSpinnerColor: =RGBA(107, 63, 160, 1)
                        AccessibleLabel: ="Players list"
                        TabIndex: =0
                        Height: =600
                        TemplateSize: =65
                        TemplatePadding: =0
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                        AlignInContainer: =AlignInContainer.Stretch
                      Children:
                        - conPlayersRowShell:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =10
                              PaddingTop: =10
                              PaddingBottom: =0
                              PaddingLeft: =4
                              PaddingRight: =4
                              Fill: =RGBA(255, 255, 255, 1)
                              DropShadow: =DropShadow.None
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                            Children:
                              - conPlayersDisplayRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Visible: =!(!IsBlank(varRenameId) && varRenameId = ThisItem.Player) && !(!IsBlank(varDeleteId) && varDeleteId = ThisItem.Player)
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =44
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                  Children:
                                    - conPlayersRowInfo:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =1
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =0
                                          LayoutMinHeight: =0
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutJustifyContent: =LayoutJustifyContent.Center
                                          LayoutAlignItems: =LayoutAlignItems.Stretch
                                          LayoutGap: =0
                                          DropShadow: =DropShadow.None
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                        Children:
                                          - txtPlayersRowName:
                                              Control: Text
                                              Properties:
                                                Text: =ThisItem.Name
                                                Size: =16
                                                Weight: ='TextCanvas.Weight'.Semibold
                                                FontColor: =RGBA(36, 36, 36, 1)
                                                Height: =24
                                                Wrap: =false
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                VerticalAlign: =VerticalAlign.Middle
                                                Align: ='TextCanvas.Align'.Start
                                          - txtPlayersRowEmail:
                                              Control: Text
                                              Properties:
                                                Text: =ThisItem.Email
                                                Visible: =!IsBlank(ThisItem.Email)
                                                Size: =13
                                                Weight: ='TextCanvas.Weight'.Regular
                                                FontColor: =RGBA(97, 97, 97, 1)
                                                Height: =20
                                                Wrap: =false
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Stretch
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                VerticalAlign: =VerticalAlign.Middle
                                                Align: ='TextCanvas.Align'.Start
                                    - btnPlayersRename:
                                        Control: Button
                                        Properties:
                                          Text: ="✎"
                                          AccessibleLabel: ="Rename " & ThisItem.Name
                                          Appearance: ='ButtonCanvas.Appearance'.Subtle
                                          FontColor: =RGBA(36, 36, 36, 1)
                                          FontSize: =18
                                          BorderRadius: =6
                                          Width: =44
                                          Height: =44
                                          LayoutMinWidth: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          OnSelect: |-
                                            =Set(varDeleteId, Blank());
                                            Set(varRenameId, ThisItem.Player);
                                            Reset(txtPlayersRenameInput)
                                    - btnPlayersDelete:
                                        Control: Button
                                        Properties:
                                          Text: ="✕"
                                          AccessibleLabel: ="Delete " & ThisItem.Name
                                          Appearance: ='ButtonCanvas.Appearance'.Subtle
                                          FontColor: =RGBA(196, 43, 28, 1)
                                          FontSize: =18
                                          BorderRadius: =6
                                          Width: =44
                                          Height: =44
                                          LayoutMinWidth: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          OnSelect: |-
                                            =Set(varRenameId, Blank());
                                            Set(varDeleteId, ThisItem.Player)
                              - conPlayersEditRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Visible: =!IsBlank(varRenameId) && varRenameId = ThisItem.Player
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =44
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                  Children:
                                    - conPlayersRenameField:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          FillPortions: =1
                                          AlignInContainer: =AlignInContainer.Stretch
                                          LayoutMinWidth: =160
                                          LayoutMinHeight: =0
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutGap: =8
                                          DropShadow: =DropShadow.None
                                          RadiusTopLeft: =0
                                          RadiusTopRight: =0
                                          RadiusBottomLeft: =0
                                          RadiusBottomRight: =0
                                        Children:
                                          - txtPlayersRenameLabel:
                                              Control: Text
                                              Properties:
                                                Text: ="Name"
                                                Size: =14
                                                Weight: ='TextCanvas.Weight'.Semibold
                                                FontColor: =RGBA(36, 36, 36, 1)
                                                Width: =52
                                                Height: =24
                                                Wrap: =false
                                                FillPortions: =0
                                                AlignInContainer: =AlignInContainer.Center
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                VerticalAlign: =VerticalAlign.Middle
                                                Align: ='TextCanvas.Align'.Start
                                          - txtPlayersRenameInput:
                                              Control: TextInput
                                              Properties:
                                                Value: =ThisItem.Name
                                                TriggerOutput: ='TextInputCanvas.TriggerOutput'.Keypress
                                                Mode: ='TextInputCanvas.Mode'.SingleLine
                                                Appearance: ='TextInputCanvas.Appearance'.Outline
                                                BasePaletteColor: =RGBA(107, 63, 160, 1)
                                                FontColor: =RGBA(36, 36, 36, 1)
                                                FontSize: =14
                                                AccessibleLabel: ="New name for " & ThisItem.Name
                                                Height: =40
                                                FillPortions: =1
                                                LayoutMinWidth: =100
                                                AlignInContainer: =AlignInContainer.Center
                                    - btnPlayersSaveRename:
                                        Control: Button
                                        Properties:
                                          Text: ="✓"
                                          AccessibleLabel: ="Save new name"
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(107, 63, 160, 1)
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          FontSize: =18
                                          BorderRadius: =6
                                          Width: =44
                                          Height: =44
                                          LayoutMinWidth: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          DisplayMode: =If(IsBlank(Trim(txtPlayersRenameInput.Value)), DisplayMode.Disabled, DisplayMode.Edit)
                                          OnSelect: |-
                                            =With(
                                              {newName: Trim(txtPlayersRenameInput.Value)},
                                              If(
                                                !IsBlank(newName),
                                                With(
                                                  {updated: Patch(Players, ThisItem, {Name: newName})},
                                                  If(
                                                    IsBlank(updated),
                                                    Notify("Could not rename the player.", NotificationType.Error),
                                                    Set(varLastPlayer, updated);
                                                    Set(varLastAction, "Renamed");
                                                    Set(varReceiptVisible, true);
                                                    Set(varRenameId, Blank())
                                                  )
                                                )
                                              )
                                            )
                                    - btnPlayersCancelRename:
                                        Control: Button
                                        Properties:
                                          Text: ="✕"
                                          AccessibleLabel: ="Cancel rename"
                                          Appearance: ='ButtonCanvas.Appearance'.Subtle
                                          FontColor: =RGBA(36, 36, 36, 1)
                                          FontSize: =18
                                          BorderRadius: =6
                                          Width: =44
                                          Height: =44
                                          LayoutMinWidth: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          OnSelect: |-
                                            =Set(varRenameId, Blank());
                                            Reset(txtPlayersRenameInput)
                              - conPlayersDeleteRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    Visible: =!IsBlank(varDeleteId) && varDeleteId = ThisItem.Player
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =44
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                  Children:
                                    - txtPlayersDeletePrompt:
                                        Control: Text
                                        Properties:
                                          Text: ="Delete " & ThisItem.Name & "?"
                                          Size: =14
                                          Weight: ='TextCanvas.Weight'.Semibold
                                          FontColor: =RGBA(196, 43, 28, 1)
                                          Height: =24
                                          Wrap: =false
                                          FillPortions: =1
                                          LayoutMinWidth: =80
                                          AlignInContainer: =AlignInContainer.Center
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          VerticalAlign: =VerticalAlign.Middle
                                          Align: ='TextCanvas.Align'.Start
                                    - btnPlayersConfirmDelete:
                                        Control: Button
                                        Properties:
                                          Text: ="Yes"
                                          AccessibleLabel: ="Yes, delete " & ThisItem.Name
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(196, 43, 28, 1)
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          FontSize: =14
                                          BorderRadius: =6
                                          Width: =64
                                          Height: =44
                                          LayoutMinWidth: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          OnSelect: |-
                                            =With(
                                              {gone: ThisItem},
                                              Remove(Players, gone);
                                              If(
                                                IsEmpty(Errors(Players)),
                                                Set(varLastPlayer, gone);
                                                Set(varLastAction, "Deleted");
                                                Set(varReceiptVisible, true);
                                                Set(varDeleteId, Blank()),
                                                Notify("Could not delete the player.", NotificationType.Error)
                                              )
                                            )
                                    - btnPlayersCancelDelete:
                                        Control: Button
                                        Properties:
                                          Text: ="Cancel"
                                          AccessibleLabel: ="Cancel delete"
                                          Appearance: ='ButtonCanvas.Appearance'.Outline
                                          FontColor: =RGBA(36, 36, 36, 1)
                                          FontSize: =14
                                          BorderRadius: =6
                                          Width: =80
                                          Height: =44
                                          LayoutMinWidth: =0
                                          FillPortions: =0
                                          AlignInContainer: =AlignInContainer.Center
                                          OnSelect: =Set(varDeleteId, Blank())
                              - conPlayersRowDivider:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    FillPortions: =0
                                    AlignInContainer: =AlignInContainer.Stretch
                                    Height: =1
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                    LayoutDirection: =LayoutDirection.Vertical
                                    Fill: =RGBA(224, 224, 224, 1)
                                    DropShadow: =DropShadow.None
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
